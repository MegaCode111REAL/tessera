# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen && xcodegen generate
# Then open Tessera.xcodeproj. Set your own team and bundle identifier below.
name: Tessera
options:
  bundleIdPrefix: dev.tessera
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  TesseraCore:
    path: .
targets:
  Tessera:
    type: application
    platform: iOS
    sources:
      - path: Tessera
    dependencies:
      - package: TesseraCore
        product: TesseraCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tessera.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Tessera/Resources/Info.plist
      properties:
        CFBundleDisplayName: Tessera
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: false
        # tessera://install?url=https://… downloads an IPA into the library (after confirmation).
        CFBundleURLTypes:
          - CFBundleURLName: dev.tessera.app
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - tessera
        # Lets Tessera appear in the share sheet / "Open in…" for .ipa files.
        CFBundleDocumentTypes:
          - CFBundleTypeName: iOS App Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.itunes.ipa
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.apple.itunes.ipa
            UTTypeDescription: iOS App Archive
            UTTypeConformsTo:
              - public.data
              - public.archive
            UTTypeTagSpecification:
              public.filename-extension:
                - ipa
              public.mime-type:
                - application/octet-stream
