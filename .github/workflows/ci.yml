name: CI

on:
  push:
  pull_request:

jobs:
  core-tests:
    name: TesseraCore tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test TesseraCore
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee swift-test.log
      # Job logs can't always be downloaded, so surface failures as annotations too.
      - name: Summarise test failures
        if: failure()
        shell: bash
        run: |
          grep -E "error:|XCTAssert|failed \(" swift-test.log | sed 's/%/%25/g' | head -45 | while IFS= read -r line; do
            echo "::error::${line:0:900}"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-test-log
          path: swift-test.log
      - name: Test fake-signing script
        run: python3 scripts/test_fake_sign.py

  app-build:
    name: Build iOS app (simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild build \
            -project Tessera.xcodeproj \
            -scheme Tessera \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  # Produces an UNSIGNED device build you can download from the run's "Artifacts" section and
  # sign/install with a sideloader of your choice. It will not install as-is.
  unsigned-ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Archive without signing
        run: |
          xcodebuild archive \
            -project Tessera.xcodeproj \
            -scheme Tessera \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Tessera.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir -p ipa/Payload
          cp -R build/Tessera.xcarchive/Products/Applications/Tessera.app ipa/Payload/
          (cd ipa && zip -qry ../Tessera-unsigned.ipa Payload)
          ls -lh Tessera-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Tessera-unsigned-ipa
          path: Tessera-unsigned.ipa
          retention-days: 30
      # Fake-signed copies of the REAL Tessera build, for testing Tessera's inspector on itself.
      # They add a fake signature blob to the binary and a hand-built profile; they are not validly
      # signed and will not install or run. See scripts/fake_sign_ipa.py.
      - name: Install ldid
        run: brew install ldid
      - name: Make fake-signed variants
        run: |
          # Prefer ldid (a genuine ad-hoc signature). If it fails, fall back to the script's
          # built-in minimal fake signature and say so loudly.
          sign() {
            out="$1"; shift
            if python3 scripts/fake_sign_ipa.py Tessera-unsigned.ipa "$out" "$@" --ldid; then return; fi
            echo "::warning::ldid signing failed for $out; used the built-in fake signature instead"
            python3 scripts/fake_sign_ipa.py Tessera-unsigned.ipa "$out" "$@"
          }
          sign Tessera-fake-signed.ipa
          sign Tessera-fake-signed-expired.ipa --expired
      - uses: actions/upload-artifact@v4
        with:
          name: Tessera-fake-signed-ipas
          path: |
            Tessera-fake-signed.ipa
            Tessera-fake-signed-expired.ipa
          retention-days: 30
      # Oracle: sign the real Tessera build with Tessera's own engine, then ask Apple's codesign.
      - name: Ad-hoc sign with Tessera's engine and verify with Apple codesign
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf oracle && mkdir oracle && ditto -x -k Tessera-unsigned.ipa oracle
          swift build -c release --product tessera-sign
          .build/release/tessera-sign oracle/Payload/Tessera.app
          codesign --verify --deep --strict -vvv oracle/Payload/Tessera.app 2>&1 | tee oracle.log
          codesign -dvvv --entitlements - oracle/Payload/Tessera.app 2>&1 | tee -a oracle.log || true
      - name: Report oracle result
        if: always()
        shell: bash
        run: |
          [ -f oracle.log ] && grep -iE "error|invalid|not valid|satisfy|modified|CodeDirectory|Hash|Signature|Identifier" oracle.log | head -20 | while IFS= read -r l; do echo "::warning::oracle: ${l:0:300}"; done || echo "::warning::oracle produced no log"
