name: CI

on:
  push:
  pull_request:

jobs:
  core-tests:
    name: TesseraCore tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test TesseraCore
        run: swift test
      - name: Test fake-signing script
        run: python3 scripts/test_fake_sign.py

  app-build:
    name: Build iOS app (simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild build \
            -project Tessera.xcodeproj \
            -scheme Tessera \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  # Produces an UNSIGNED device build you can download from the run's "Artifacts" section and
  # sign/install with a sideloader of your choice. It will not install as-is.
  unsigned-ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Archive without signing
        run: |
          xcodebuild archive \
            -project Tessera.xcodeproj \
            -scheme Tessera \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Tessera.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir -p ipa/Payload
          cp -R build/Tessera.xcarchive/Products/Applications/Tessera.app ipa/Payload/
          (cd ipa && zip -qry ../Tessera-unsigned.ipa Payload)
          ls -lh Tessera-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Tessera-unsigned-ipa
          path: Tessera-unsigned.ipa
          retention-days: 30
      # Fake-signed copies of the REAL Tessera build, for testing Tessera's inspector on itself.
      # They add a fake signature blob to the binary and a hand-built profile; they are not validly
      # signed and will not install or run. See scripts/fake_sign_ipa.py.
      - name: Install ldid
        run: brew install ldid
      - name: Make fake-signed variants
        run: |
          # Prefer ldid (a genuine ad-hoc signature). If it fails, fall back to the script's
          # built-in minimal fake signature and say so loudly.
          sign() {
            out="$1"; shift
            if python3 scripts/fake_sign_ipa.py Tessera-unsigned.ipa "$out" "$@" --ldid; then return; fi
            echo "::warning::ldid signing failed for $out; used the built-in fake signature instead"
            python3 scripts/fake_sign_ipa.py Tessera-unsigned.ipa "$out" "$@"
          }
          sign Tessera-fake-signed.ipa
          sign Tessera-fake-signed-expired.ipa --expired
      - uses: actions/upload-artifact@v4
        with:
          name: Tessera-fake-signed-ipas
          path: |
            Tessera-fake-signed.ipa
            Tessera-fake-signed-expired.ipa
          retention-days: 30
