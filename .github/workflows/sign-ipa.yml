name: Build and Sign Tessera IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "Signing and export method"
        required: true
        type: choice
        default: development
        options:
          - development
          - ad-hoc
          - app-store-connect

permissions:
  contents: read

concurrency:
  group: tessera-signed-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign-ipa:
    name: Build and sign iOS IPA
    runs-on: macos-15
    timeout-minutes: 45

    env:
      EXPORT_METHOD: ${{ inputs.export_method }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}

    steps:
      - name: Check out Tessera
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for name in IOS_TEAM_ID IOS_BUNDLE_ID CERTIFICATE_BASE64 CERTIFICATE_PASSWORD PROFILE_BASE64; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required secret is missing: $name (check repository Settings > Secrets and variables > Actions)."
              exit 1
            fi
          done
          # Tolerate a pasted newline/whitespace and a leading "TEAMID." on the bundle ID.
          IOS_TEAM_ID="$(printf '%s' "$IOS_TEAM_ID" | tr -d '[:space:]')"
          IOS_BUNDLE_ID="$(printf '%s' "$IOS_BUNDLE_ID" | tr -d '[:space:]')"
          IOS_BUNDLE_ID="${IOS_BUNDLE_ID#"$IOS_TEAM_ID".}"
          { echo "IOS_TEAM_ID=$IOS_TEAM_ID"; echo "IOS_BUNDLE_ID=$IOS_BUNDLE_ID"; } >> "$GITHUB_ENV"
          if [[ "$IOS_BUNDLE_ID" == *" "* || "$IOS_TEAM_ID" == *" "* ]]; then
            echo "::error::IOS_BUNDLE_ID and IOS_TEAM_ID must not contain spaces."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import signing certificate and provisioning profile
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/tessera-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERTIFICATE_PATH="$RUNNER_TEMP/signing-certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/signing-profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/signing-profile.plist"

          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "::add-mask::$CERTIFICATE_PASSWORD"

          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")

          if [[ "$PROFILE_TEAM" != "$IOS_TEAM_ID" ]]; then
            echo "::error::The provisioning profile Team ID does not match IOS_TEAM_ID."
            exit 1
          fi
          # The profile covers either exactly TEAM.<bundle id> or a wildcard such as TEAM.* / TEAM.com.example.*
          PROFILE_PATTERN="${PROFILE_APP_ID#*.}"
          MATCH=false
          if [[ "$PROFILE_PATTERN" == "$IOS_BUNDLE_ID" || "$PROFILE_PATTERN" == "*" ]]; then
            MATCH=true
          elif [[ "$PROFILE_PATTERN" == *"*" && "$IOS_BUNDLE_ID" == "${PROFILE_PATTERN%\*}"* ]]; then
            MATCH=true
          fi
          if [[ "$MATCH" != true ]]; then
            echo "::error::The profile covers the App ID pattern '$PROFILE_PATTERN' but IOS_BUNDLE_ID is different (length ${#IOS_BUNDLE_ID}, secrets are masked in logs). Set IOS_BUNDLE_ID to a bundle ID the profile allows, with no spaces or newline."
            exit 1
          fi

          PROFILE_GET_TASK_ALLOW=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$PROFILE_PLIST" 2>/dev/null || echo false)
          case "$EXPORT_METHOD" in
            development)
              if [[ "$PROFILE_GET_TASK_ALLOW" != "true" ]]; then
                echo "::error::Development export requires a development provisioning profile."
                exit 1
              fi
              SIGNING_IDENTITY="Development"
              ;;
            ad-hoc|app-store-connect)
              if [[ "$PROFILE_GET_TASK_ALLOW" == "true" ]]; then
                echo "::error::$EXPORT_METHOD export requires a distribution provisioning profile, not a development profile."
                exit 1
              fi
              SIGNING_IDENTITY="Distribution"
              ;;
            *)
              echo "::error::Unsupported export method: $EXPORT_METHOD"
              exit 1
              ;;
          esac

          echo "Identities in the .p12 (including ones the runner does not trust):"
          security find-identity -p codesigning "$KEYCHAIN_PATH" | sed -E 's/[0-9A-F]{40}/<sha1>/' || true
          if ! security find-identity -p codesigning "$KEYCHAIN_PATH" | grep -Fq "$SIGNING_IDENTITY"; then
            echo "::error::No usable $SIGNING_IDENTITY certificate in the .p12 for the '$EXPORT_METHOD' export (see the identity list above). Use a matching certificate, or pick the export method that matches your .p12 and profile."
            security find-identity -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi

          # Use the exact certificate name from the .p12 (e.g. "Apple Distribution: Name (TEAM)").
          SIGNING_IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN_PATH" | grep -F "$SIGNING_IDENTITY" | head -1 | sed -E 's/^[^"]*"([^"]*)".*$/\1/')"
          {
            echo "PROFILE_UUID=$PROFILE_UUID"
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "SIGNING_IDENTITY=$SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          rm -f "$CERTIFICATE_PATH" "$PROFILE_PATH" "$PROFILE_PLIST"
          echo "Imported signing assets. Profile name: $PROFILE_NAME"
          echo "Export method: $EXPORT_METHOD"

      - name: Archive Tessera for iOS devices
        shell: bash
        run: |
          set -uo pipefail
          # Signing settings go on the Tessera target only. Passing them on the command line would
          # also hit the ZIPFoundation package target, which cannot use a provisioning profile.
          python3 - <<'PY'
          import os, re
          text = open("project.yml").read()
          extra = {
              "CODE_SIGN_STYLE": "Manual",
              "CODE_SIGN_IDENTITY": os.environ["SIGNING_IDENTITY"],
              "DEVELOPMENT_TEAM": os.environ["IOS_TEAM_ID"],
              "PROVISIONING_PROFILE_SPECIFIER": os.environ["PROFILE_NAME"],
              "PRODUCT_BUNDLE_IDENTIFIER": os.environ["IOS_BUNDLE_ID"],
          }
          for key, value in extra.items():
              text = re.sub(r"^(\s+)%s:.*$" % key, "", text, flags=re.M)
          lines = "".join('        %s: "%s"\n' % (k, v.replace('"', '\\"')) for k, v in extra.items())
          text = text.replace("      base:\n", "      base:\n" + lines, 1)
          open("project.yml", "w").write(text)
          PY
          xcodegen generate
          xcodebuild archive \
            -project Tessera.xcodeproj \
            -scheme Tessera \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Tessera.xcarchive" 2>&1 | tee "$RUNNER_TEMP/archive.log"
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            grep -iE "error:|provisioning profile|requires a|does not|doesn.t|no certificate|no signing|not found|entitlement" "$RUNNER_TEMP/archive.log" \
              | grep -v "^\*\* ARCHIVE" | awk '!seen[$0]++' | head -25 | while IFS= read -r line; do
              echo "::error::${line:0:700}"
            done
          fi
          exit $status

      - name: Create export options
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import plistlib

          options = {
              "method": os.environ["EXPORT_METHOD"],
              "teamID": os.environ["IOS_TEAM_ID"],
              "signingStyle": "manual",
              "provisioningProfiles": {
                  os.environ["IOS_BUNDLE_ID"]: os.environ["PROFILE_NAME"]
              },
              "destination": "export",
              "stripSwiftSymbols": True,
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist"), "wb") as f:
              plistlib.dump(options, f)
          PY

      - name: Export signed IPA
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Tessera.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          IPA_PATH="$(find "$RUNNER_TEMP/ipa-export" -maxdepth 1 -name '*.ipa' -type f -print -quit)"
          if [[ -z "$IPA_PATH" ]]; then
            echo "::error::Xcode completed export but no IPA was found."
            find "$RUNNER_TEMP/ipa-export" -maxdepth 2 -type f -print || true
            exit 1
          fi
          cp "$IPA_PATH" "$RUNNER_TEMP/Tessera-signed.ipa"
          ls -lh "$RUNNER_TEMP/Tessera-signed.ipa"

      - name: Verify exported IPA signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa-check"
          ditto -x -k "$RUNNER_TEMP/Tessera-signed.ipa" "$RUNNER_TEMP/ipa-check"
          APP_PATH="$RUNNER_TEMP/ipa-check/Payload/Tessera.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "::error::IPA does not contain Payload/Tessera.app."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -E '^(Identifier|TeamIdentifier|Authority)=' || true
          echo "IPA packaging and code-signature verification passed."

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: Tessera-signed-ipa
          path: ${{ runner.temp }}/Tessera-signed.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Clean up signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/tessera-signing.keychain-db" >/dev/null 2>&1 || true
          if [[ -n "${PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/signing-certificate.p12" "$RUNNER_TEMP/signing-profile.mobileprovision" "$RUNNER_TEMP/signing-profile.plist"
